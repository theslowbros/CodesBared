<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CodesBared</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="page">
    <header class="top">
      <h1>CodesBared</h1>
    </header>

    <main class="app">
      <section class="controls">
        <div class="format-picker">
          <div class="format-cats" id="formatCats" role="tablist" aria-label="Format category"></div>
          <input id="formatFilter" type="search" placeholder="Search formats" autocomplete="off" aria-label="Search formats">
          <div class="format-chips" id="formatChips" role="listbox" aria-label="Formats"></div>
          <input type="hidden" id="formatSelect" value="qr">
        </div>

        <label class="field">
          <span class="field-label">Content</span>
          <div class="content-wrap">
            <textarea id="input" rows="1" placeholder="URL or text" autofocus autocomplete="off" spellcheck="false"></textarea>
            <button type="button" class="random-btn" id="randomBtn" title="Random valid content for this format">Random</button>
          </div>
          <span class="format-hint" id="formatHint"></span>
        </label>

        <div class="field" id="qrContentSection">
          <span class="field-label">QR content</span>
          <div class="choice-row" id="qrKindBtns"></div>
          <div class="qr-fields" id="qrFields"></div>
        </div>

        <div class="field">
          <span class="field-label">Size</span>
          <div class="size-row">
            <div class="options">
              <button type="button" class="size-btn" data-size="180">180</button>
              <button type="button" class="size-btn active" data-size="240">240</button>
              <button type="button" class="size-btn" data-size="320">320</button>
              <button type="button" class="size-btn" data-size="400">400</button>
            </div>
            <label class="size-custom">
              <input type="number" id="sizeCustom" value="240" min="50" max="2000" step="10">
              <span id="sizeUnitLabel">px</span>
            </label>
          </div>
        </div>

        <div class="field quiet-row">
          <span class="field-label">Space</span>
          <input type="range" id="quietZone" min="0" max="10" value="4" step="1">
          <span id="quietZoneVal">4 modules</span>
        </div>

        <div class="field">
          <span class="field-label">Colors</span>
          <div class="color-row">
            <div class="color-field">
              <label for="darkColor">Code</label>
              <div class="swatch-wrap">
                <input type="color" id="darkColor" value="#10131a">
                <input type="text" id="darkColorHex" class="hex-input" value="#10131a" maxlength="7">
              </div>
            </div>
            <button type="button" class="swap-btn" id="swapColors" title="Swap colors">⇄</button>
            <div class="color-field">
              <label for="lightColor">Background</label>
              <div class="swatch-wrap" id="lightSwatch">
                <input type="color" id="lightColor" value="#e7e6df">
                <input type="text" id="lightColorHex" class="hex-input" value="#e7e6df" maxlength="7">
              </div>
            </div>
          </div>
          <label class="check-row" for="transparentBg">
            <input type="checkbox" id="transparentBg">
            <span>Transparent background</span>
          </label>
          <div class="contrast-row">
            <span class="contrast-badge" id="contrastBadge">7.0:1</span>
            <button type="button" class="fix-btn" id="fixContrast">Boost contrast</button>
          </div>
        </div>

        <div class="field" id="qrStyleSection">
          <span class="field-label">QR style</span>
          <div class="qr-style-block">
            <span class="micro-label">Pattern</span>
            <div id="qrModuleBtns">
              <div class="choice-row">
                <button type="button" class="choice-btn active" data-module="square">Square</button>
                <button type="button" class="choice-btn" data-module="rounded">Round</button>
                <button type="button" class="choice-btn" data-module="dots">Dots</button>
                <button type="button" class="choice-btn" data-module="smooth">Smooth</button>
                <button type="button" class="choice-btn" data-module="custom">Custom</button>
              </div>
              <div class="stamp-row" id="qrModuleStamps"></div>
            </div>
            <div class="radius-row" id="moduleScaleRow">
              <span class="micro-label">Size</span>
              <input type="range" id="qrModuleScale" min="70" max="110" value="100" step="1">
              <span id="qrModuleScaleVal">100%</span>
            </div>
            <div class="radius-row is-off" id="moduleRadiusRow">
              <span class="micro-label">Round</span>
              <input type="range" id="qrModuleR" min="0" max="100" value="80" step="1">
              <span id="qrModuleRVal">80%</span>
            </div>
            <div class="logo-row is-off" id="dotCustomRow">
              <label class="logo-upload-btn" id="dotCustomLabel" for="dotCustomInput">Upload shape</label>
              <input type="file" id="dotCustomInput" accept="image/*" hidden>
              <img class="logo-thumb" id="dotCustomThumb" alt="Custom module">
              <button type="button" class="logo-clear" id="dotCustomClear">Remove</button>
            </div>
            <div id="moduleOrientWrap">
              <span class="micro-label">Turn</span>
              <div class="choice-row" id="qrOrientBtns">
                <button type="button" class="choice-btn active" data-orient="none">Upright</button>
                <button type="button" class="choice-btn" data-orient="rotate">Rotate</button>
                <button type="button" class="choice-btn" data-orient="converge">Converge</button>
              </div>
              <div class="radius-row is-off" id="moduleRotRow">
                <span class="micro-label">Angle</span>
                <input type="range" id="qrModuleRot" min="0" max="360" value="0" step="1">
                <span id="qrModuleRotVal">0°</span>
              </div>
              <div class="aim-row is-off" id="moduleAimRow">
                <div class="aim-pad" id="qrAimPad" role="application" tabindex="0" aria-label="Aim point">
                  <span class="aim-dot" id="qrAimDot"></span>
                </div>
                <div class="choice-row" id="qrAimPresetBtns">
                  <button type="button" class="choice-btn" data-aim="center">Center</button>
                  <button type="button" class="choice-btn" data-aim="top">Top</button>
                  <button type="button" class="choice-btn" data-aim="right">Right</button>
                  <button type="button" class="choice-btn" data-aim="bottom">Bottom</button>
                  <button type="button" class="choice-btn" data-aim="left">Left</button>
                </div>
              </div>
            </div>
          </div>
          <div class="qr-style-block">
            <span class="micro-label">Marker border</span>
            <div class="choice-row" id="qrEyeBorderBtns">
              <button type="button" class="choice-btn active" data-eye-border="square">Square</button>
              <button type="button" class="choice-btn" data-eye-border="rounded">Round</button>
              <button type="button" class="choice-btn" data-eye-border="circle">Circle</button>
            </div>
            <div class="radius-row">
              <span class="micro-label">Outer</span>
              <input type="range" id="qrEyeOuterR" min="0" max="100" value="0" step="1">
              <span id="qrEyeOuterRVal">0%</span>
            </div>
            <div class="radius-row">
              <span class="micro-label">Inner</span>
              <input type="range" id="qrEyeInnerR" min="0" max="100" value="0" step="1">
              <span id="qrEyeInnerRVal">0%</span>
            </div>
            <div class="radius-row">
              <span class="micro-label">Ring</span>
              <input type="range" id="qrEyeRing" min="50" max="160" value="100" step="1">
              <span id="qrEyeRingVal">100%</span>
            </div>
          </div>
          <div class="qr-style-block">
            <span class="micro-label">Marker center</span>
            <div id="qrEyeCenterBtns">
              <div class="choice-row">
                <button type="button" class="choice-btn active" data-eye-center="square">Square</button>
                <button type="button" class="choice-btn" data-eye-center="rounded">Round</button>
                <button type="button" class="choice-btn" data-eye-center="dots">Dots</button>
                <button type="button" class="choice-btn" data-eye-center="custom">Custom</button>
              </div>
              <div class="stamp-row" id="qrEyeCenterStamps"></div>
            </div>
            <div class="radius-row" id="centerRadiusRow">
              <span class="micro-label">Radius</span>
              <input type="range" id="qrEyeCenterR" min="0" max="100" value="0" step="1">
              <span id="qrEyeCenterRVal">0%</span>
            </div>
            <div class="radius-row">
              <span class="micro-label">Size</span>
              <input type="range" id="qrEyeCenterScale" min="70" max="120" value="100" step="1">
              <span id="qrEyeCenterScaleVal">100%</span>
            </div>
          </div>
          <label class="check-row" for="qrGradient">
            <input type="checkbox" id="qrGradient">
            <span>Gradient on the code</span>
          </label>
          <div id="gradientControls" class="is-off">
            <div class="color-row" id="gradientColors">
              <div class="color-field">
                <label for="darkColor2">Gradient end</label>
                <div class="swatch-wrap">
                  <input type="color" id="darkColor2" value="#0b6e4f">
                  <input type="text" id="darkColor2Hex" class="hex-input" value="#0b6e4f" maxlength="7">
                </div>
              </div>
              <button type="button" class="swap-btn" id="swapGradient" title="Swap code and gradient colors">⇄</button>
              <div class="choice-row" id="gradientDirBtns" role="group" aria-label="Gradient direction">
                <button type="button" class="choice-btn active" data-angle="45">↘</button>
                <button type="button" class="choice-btn" data-angle="0">→</button>
                <button type="button" class="choice-btn" data-angle="90">↓</button>
              </div>
            </div>
            <div class="radius-row">
              <span class="micro-label">Angle</span>
              <input type="range" id="qrGradientAngle" min="0" max="360" value="45" step="1">
              <span id="qrGradientAngleVal">45°</span>
            </div>
          </div>
        </div>

        <div class="divider" id="brandingDivider"></div>

        <div class="field" id="brandingSection">
          <span class="field-label">Logo</span>
          <div class="logo-row">
            <label class="logo-upload-btn" id="logoLabel" for="logoInput">Add logo</label>
            <input type="file" id="logoInput" accept="image/*" hidden>
            <img class="logo-thumb" id="logoThumb" alt="Logo preview">
            <button type="button" class="logo-clear" id="logoClear">Remove</button>
          </div>
          <div class="logo-size-row" id="logoSizeRow">
            <span>Logo size</span>
            <input type="range" id="logoSize" min="12" max="28" value="20">
            <span id="logoSizeVal">20%</span>
          </div>
        </div>
      </section>

      <section class="preview">
        <div class="preview-toolbar">
          <span class="micro-label">Preview</span>
          <div class="choice-row" id="previewModeBtns" role="group" aria-label="Preview format">
            <button type="button" class="choice-btn active" data-preview="svg">SVG</button>
            <button type="button" class="choice-btn" data-preview="png">PNG</button>
          </div>
        </div>
        <div class="qr-stage empty" id="stage">
          <div id="stage-output"></div>
        </div>
        <div class="footer-row">
          <div class="status-line">
            <span class="type-tip" id="typeTip" tabindex="0" aria-describedby="typeTipBubble">
              <span class="type-tip-name" id="typeTipName">QR Code</span>
              <span class="type-tip-bubble" id="typeTipBubble" role="tooltip"></span>
            </span>
            <span class="status" id="status">idle</span>
          </div>
          <div class="download-group">
            <svg class="download-icon" viewBox="0 0 16 16" width="13" height="13" aria-hidden="true">
              <path fill="currentColor" d="M7.25 2h1.5v6.17l2.08-2.08 1.06 1.06L8 11.04 4.11 7.15l1.06-1.06 2.08 2.08V2zM3 12.25h10V14H3z"/>
            </svg>
            <button type="button" class="download-btn secondary" id="downloadSvg" aria-label="Download SVG">SVG</button>
            <button type="button" class="download-btn" id="download" aria-label="Download PNG">PNG</button>
          </div>
        </div>
        <p class="offline-tag" id="offlineTag"></p>
      </section>
    </main>
  </div>

  <script src="vendor/qrcode.js"></script>
  <script src="vendor/bwip-js.min.js"></script>
  <script src="js/colors.js"></script>
  <script src="js/formats.js"></script>
  <script src="js/payloads.js"></script>
  <script src="js/logo.js"></script>
  <script src="js/persist.js"></script>
  <script src="js/engines/qr.js"></script>
  <script src="js/engines/bwip.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
