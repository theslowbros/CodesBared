<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SVG_PENDING</title>
  <style>
    :root {
      --bg: #10131a;
      --panel: #171b24;
      --line: #262c38;
      --ink: #e7e6df;
      --dim: #8b93a7;
      --accent: #5eead4;
      --bad: #f2606a;
      --mono: ui-monospace, "Cascadia Code", "SF Mono", Menlo, Consolas, monospace;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--mono);
      padding: 24px;
    }
    h1 { font-size: 18px; font-weight: 600; margin: 0 0 8px; }
    h1 span { color: var(--dim); }
    #summary { color: var(--dim); font-size: 12px; margin-bottom: 20px; }
    #summary.bad { color: var(--bad); }
    #summary.ok { color: var(--accent); }
    .group { margin: 0 0 28px; }
    .group h2 {
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--dim);
      margin: 0 0 12px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 12px;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      min-height: 160px;
    }
    .card.fail { border-color: rgba(242, 96, 106, 0.5); }
    .card h3 { font-size: 12px; margin: 0 0 8px; font-weight: 600; }
    .preview {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100px;
      background: #0d1016;
      border-radius: 6px;
      overflow: auto;
      padding: 8px;
    }
    .preview svg { max-width: 100%; height: auto; display: block; }
    .err { color: var(--bad); font-size: 10px; margin-top: 8px; line-height: 1.4; }
  </style>
</head>
<body>
  <h1>codes<span>://</span>bared · svg gallery</h1>
  <div id="summary">rendering…</div>
  <div id="gallery"></div>

  <script src="../vendor/qrcode.js"></script>
  <script src="../vendor/bwip-js.min.js"></script>
  <script src="../js/colors.js"></script>
  <script src="../js/formats.js"></script>
  <script src="../js/engines/qr.js"></script>
  <script src="../js/engines/bwip.js"></script>
  <script>
(function () {
  const gallery = document.getElementById('gallery');
  const summary = document.getElementById('summary');
  const groups = {};
  CodesBared.formats.GROUPS.forEach(function (group) {
    const section = document.createElement('section');
    section.className = 'group';
    const h2 = document.createElement('h2');
    h2.textContent = group.label;
    const grid = document.createElement('div');
    grid.className = 'grid';
    section.appendChild(h2);
    section.appendChild(grid);
    gallery.appendChild(section);
    groups[group.id] = grid;
  });

  let failed = 0;
  const results = [];

  CodesBared.formats.list.forEach(function (format) {
    const card = document.createElement('article');
    card.className = 'card';
    const title = document.createElement('h3');
    title.textContent = format.label;
    const preview = document.createElement('div');
    preview.className = 'preview';
    card.appendChild(title);
    card.appendChild(preview);
    (groups[format.group] || gallery).appendChild(card);

    const payload = CodesBared.formats.payload(format);
    try {
      let svg;
      if (format.engine === 'qr') {
        svg = CodesBared.engines.qr.render(payload, {
          size: 140, quiet: format.quietDefault, dark: '#10131a', light: '#e7e6df'
        }).svg;
      } else {
        svg = CodesBared.engines.bwip.render(format, payload, {
          size: 140, quiet: format.quietDefault, dark: '#10131a', light: '#e7e6df'
        }).svg;
      }
      if (!svg || svg.indexOf('<svg') === -1) throw new Error('no svg');
      preview.innerHTML = svg;
      results.push('ok    ' + format.id);
    } catch (err) {
      failed += 1;
      card.classList.add('fail');
      const msg = document.createElement('div');
      msg.className = 'err';
      msg.textContent = err && err.message ? err.message : String(err);
      card.appendChild(msg);
      results.push('FAIL  ' + format.id + '  ' + msg.textContent);
    }
  });

  const total = CodesBared.formats.list.length;
  const ok = total - failed;
  if (failed) {
    summary.textContent = failed + ' failed · ' + ok + ' rendered';
    summary.className = 'bad';
    document.title = 'SVG_FAIL';
  } else {
    summary.textContent = ok + ' formats rendered to SVG';
    summary.className = 'ok';
    document.title = 'SVG_OK';
  }
  window.__SVG_RESULTS__ = results;
})();
  </script>
</body>
</html>
